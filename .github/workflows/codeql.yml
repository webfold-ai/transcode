name: CodeQL

# Static analysis for the Scorecard SAST check. Runs on pull requests that touch Rust
# sources, on pushes to main, and weekly as a backstop.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-04
        with:
          toolchain: stable
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:rust"
