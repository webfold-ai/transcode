name: Supply chain

# RustSec advisories, dependency policy, and a CycloneDX SBOM. Scheduled daily so new
# advisories surface even when no code changes.

on:
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.lock"
      - "src/**"
      - "tests/**"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-04
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-04
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.19.4
      - name: Check advisories, bans, licenses, sources
        run: cargo deny check advisories bans licenses sources

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-04
        with:
          toolchain: stable
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename transcode.sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcode-cyclonedx-sbom
          path: transcode.sbom.json
          retention-days: 90

  evidence:
    name: Supply-chain evidence record
    if: always()
    needs: [audit, deny, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write evidence record
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          DENY_RESULT: ${{ needs.deny.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "event": "ptyktos.supply_chain.audit",
              "ts": datetime.now(timezone.utc).isoformat(),
              "repo": os.environ["REPOSITORY"],
              "audit": os.environ["AUDIT_RESULT"],
              "deny": os.environ["DENY_RESULT"],
              "sbom": os.environ["SBOM_RESULT"],
              "sbom_path": "transcode.sbom.json",
          }
          with open("evidence/supply-chain.json", "w") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
      - name: Upload evidence record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: evidence/supply-chain.json
          retention-days: 90
