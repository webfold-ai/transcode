# Standalone sovereign audio codec crate (carved out of the sanguine repo).
# The empty [workspace] table keeps it self-contained if ever nested under
# another workspace, so it always builds on its own.
[workspace]

[package]
name = "transcode"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Pure-Rust, std-only audio, image and video codec crate. Decoders and encoders are from scratch; no ffmpeg, libpng, libjpeg or other C libraries."
repository = "https://github.com/webfold-ai/transcode"
readme = "README.md"
keywords = ["codec", "audio", "image", "video"]
categories = ["multimedia", "multimedia::audio", "multimedia::images", "multimedia::video"]

[[bin]]
name = "transcode"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dev-dependencies]
# Independent WebP decoder, used only to verify the encoder's output in tests.
image-webp = "0.2.4"

[lints.clippy]
# Clippy style/complexity/perf findings are advisory, not blocking. The crate has about
# 380 of them today, mostly `excessive_precision` on DSP float tables and index-based
# loops that mirror the spec text. Fixing them by hand would edit numeric tables, so
# they are tracked as debt instead. Correctness and suspicious lints remain on and are
# denied by `cargo clippy -- -D warnings` in CI.
style = "allow"
complexity = "allow"
perf = "allow"
